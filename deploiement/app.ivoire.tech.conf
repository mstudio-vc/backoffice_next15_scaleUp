# /etc/apache2/sites-available/app.ivoire.tech.conf
#
# Calqué sur `back-office-qa.yelema.ai`, le seul précédent d'application Node derrière Apache.
# Certbot ajoutera le pendant en :443 (`--apache -d app.ivoire.tech`), qu'il écrira dans un
# fichier `-le-ssl.conf` séparé — ne pas le modifier à la main.

<VirtualHost *:80>
    ServerName app.ivoire.tech
    DocumentRoot /var/www/html

    # Certbot dépose ses fichiers de validation ici : ils ne doivent pas partir au proxy.
    <Location "/.well-known/acme-challenge/">
        ProxyPass "!"
    </Location>

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    # Derrière Cloudflare, c'est lui qui termine TLS : l'application doit savoir que la requête
    # d'origine était en https, sans quoi ses cookies `secure` et ses liens absolus se trompent.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/app.ivoire.tech-error.log
    CustomLog ${APACHE_LOG_DIR}/app.ivoire.tech-access.log combined
</VirtualHost>
