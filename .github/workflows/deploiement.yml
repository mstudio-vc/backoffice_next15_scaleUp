name: Déploiement

# Comme les autres sites de la maison : la branche `production` fait foi, `main` est le travail
# en cours. Aucune coordonnée de serveur n'apparaît ici — Cloudflare masque l'IP d'origine, et
# l'écrire dans un dépôt permettrait de viser le serveur en le contournant.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploiement-app-ivoire-tech
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Une seule source de vérité : `.nvmrc`. La version doit rester celle du serveur
          # (Node 20) pour deux raisons — construire sur plus récent laisserait passer un code
          # que le serveur ne saurait pas exécuter, et `npm ci` refuse un verrou produit par un
          # autre npm que le sien. C'est exactement ce qui a fait échouer le premier essai.
          node-version-file: .nvmrc
          cache: npm

      - name: Installer
        run: npm ci

      - name: Contrôler les types
        run: npm run typecheck

      - name: Cliquet d'interface
        run: npm run cliquet

      - name: Construire
        run: npm run build

      - name: Assembler le paquet
        run: |
          set -eu
          # La sortie autonome n'embarque ni les ressources statiques ni `public/` : Next
          # attend qu'on les replace à côté du serveur.
          mkdir -p paquet
          cp -r .next/standalone/. paquet/
          mkdir -p paquet/.next
          cp -r .next/static paquet/.next/static
          [ -d public ] && cp -r public paquet/public || true
          cp -r drizzle paquet/drizzle
          cp deploiement/migrer.sh paquet/migrer.sh
          chmod +x paquet/migrer.sh
          # Garde-fou : un paquet qui contiendrait les exports de candidature exposerait les
          # données personnelles de 155 entreprises. On arrête plutôt que de l'envoyer.
          if [ -e paquet/data ] || find paquet -name '*.xlsx' -print -quit | grep -q .; then
            echo "Le paquet contient des données de candidature. Déploiement interrompu." >&2
            exit 1
          fi

      - name: Préparer SSH
        env:
          CLE: ${{ secrets.VPS_SSH_KEY }}
          HOTES: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOTE: ${{ secrets.VPS_HOST }}
          UTILISATEUR: ${{ secrets.VPS_USER }}
          CHEMIN: ${{ secrets.VPS_PATH }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Les secrets sont masqués dans les journaux : une erreur de collage produit sinon un
          # message incompréhensible (« error in libcrypto », destination rsync absurde). On
          # contrôle leur FORME ici, où l'on peut encore nommer le coupable.
          verifier_une_ligne() {
            if [ "$(printf '%s' "$2" | wc -l)" -ne 0 ]; then
              echo "Le secret $1 contient plusieurs lignes. Avez-vous collé la clé privée dedans ?" >&2
              exit 1
            fi
            if [ -z "$2" ]; then
              echo "Le secret $1 est vide." >&2
              exit 1
            fi
          }
          verifier_une_ligne VPS_HOST "$HOTE"
          verifier_une_ligne VPS_USER "$UTILISATEUR"
          verifier_une_ligne VPS_PATH "$CHEMIN"

          case "$CHEMIN" in
            /*/) : ;;
            *) echo "VPS_PATH doit être un chemin absolu terminé par une barre oblique (rsync distingue /courant de /courant/)." >&2; exit 1 ;;
          esac

          # Les retours chariot d'un copier-coller depuis Windows rendent la clé illisible.
          printf '%s\n' "$CLE" | tr -d '\r' > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement

          if ! ssh-keygen -y -f ~/.ssh/id_deploiement >/dev/null 2>&1; then
            echo "Le secret VPS_SSH_KEY n'est pas une clé privée lisible." >&2
            echo "Attendu : le contenu de ~/.ssh/app_ivoire_deploy — la clé PRIVÉE, sans .pub," >&2
            echo "lignes BEGIN/END comprises. Copiez-la avec : pbcopy < ~/.ssh/app_ivoire_deploy" >&2
            exit 1
          fi

          printf '%s\n' "$HOTES" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Secrets conformes."

      - name: Envoyer
        run: |
          set -eu
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploiement -o IdentitiesOnly=yes" \
            --exclude '.well-known' \
            paquet/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}"

      - name: Migrer puis redémarrer
        run: |
          set -eu
          ssh -i ~/.ssh/id_deploiement -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -eu
             cd "${{ secrets.VPS_PATH }}"
             set -a; . /etc/app-ivoire-tech.env; set +a
             sh ./migrer.sh drizzle
             sudo -n /usr/bin/systemctl restart app-ivoire-tech'

      - name: Vérifier
        run: |
          set -eu
          # On interroge le service en local sur le serveur : à ce stade, le DNS public et le
          # cache Cloudflare ne doivent pas entrer dans le verdict.
          ssh -i ~/.ssh/id_deploiement -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'for i in $(seq 1 20); do
               code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/connexion || true)
               [ "$code" = "200" ] && echo "Service en ligne (HTTP $code)" && exit 0
               sleep 2
             done
             echo "Le service ne répond pas après 40 s." >&2
             exit 1'
